name: Render Character V2

on:
  push:
    branches:
      - visual/rebuild-vs01-v2
    paths:
      - 'tools/blender/build_player_character_v2.py'
      - 'tools/blender/build_player_character_v26.py'
      - 'tools/blender/build_player_character_v27.py'
      - 'tools/blender/build_player_character_v28.py'
      - 'tools/blender/build_player_character_v29.py'
      - 'tools/blender/build_player_character_v30.py'
      - 'tools/blender/build_player_character_v31.py'
      - 'tools/blender/build_player_character_v32.py'
      - 'tools/blender/build_player_character_v33.py'
      - 'tools/blender/build_player_character_v34.py'
      - 'tools/blender/build_player_character_v35.py'
      - 'tools/blender/build_player_character_v36.py'
      - 'tools/blender/build_player_character_v37.py'
      - 'tools/blender/build_player_character_v38.py'
      - 'tools/blender/build_player_character_v39.py'
      - 'tools/blender/build_player_character_v40.py'
      - 'tools/blender/build_player_character_v41.py'
      - 'tools/blender/build_player_character_v50.py'
      - 'tools/blender/build_player_character_v51.py'
      - 'tools/blender/build_player_character_v52.py'
      - 'tools/blender/build_player_character_v53.py'
      - 'tools/blender/build_player_character_v54.py'
      - 'tools/blender/build_player_character_v55.py'
      - 'tools/blender/build_player_character_v56.py'
      - 'tools/blender/build_player_character_v57.py'
      - 'tools/blender/build_player_character_v58.py'
      - 'tools/blender/build_player_character_v59.py'
      - 'tools/blender/build_player_character_v60.py'
      - 'tools/blender/build_player_character_v61.py'
      - 'tools/blender/build_player_character_v62.py'
      - 'tools/blender/build_player_character_v63.py'
      - 'tools/blender/build_player_character_v64.py'
      - 'tools/blender/build_player_character_v65.py'
      - 'tools/blender/build_player_character_v66.py'
      - 'scripts/character_v2_model_review.gd'
      - 'scenes/CharacterV2ModelReview.tscn'
      - 'scripts/character_candidate_scale_review.gd'
      - 'scenes/CharacterCandidateScaleReview.tscn'
      - '.github/workflows/render-character-v2.yml'
  workflow_dispatch:

concurrency:
  group: lembah-sari-character-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y blender python3-numpy unzip xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxi6 libxcursor1 libxinerama1 libxkbcommon0 libasound2t64
          blender --version
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Build Character V6.6 silhouette polish candidate GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/review
          LEMBAH_CHARACTER_OUT="$PWD/assets/review/player_character_candidate.glb" \
            blender --background --python tools/blender/build_player_character_v66.py
          test -s assets/review/player_character_candidate.glb
          file assets/review/player_character_candidate.glb
          ls -lh assets/review/player_character_candidate.glb

      - name: Import and validate Character V6.6 candidate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit-after 60

      - name: Render Character V6.6 candidate studio review
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --resolution 1280x720 --rendering-method gl_compatibility res://scenes/CharacterV2ModelReview.tscn
          test -s character_v2_model_review.png
          test -s character_v2_detail_review.png
          file character_v2_model_review.png
          file character_v2_detail_review.png

      - name: Render V6.6 gameplay-scale comparison
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --resolution 1280x720 --rendering-method gl_compatibility res://scenes/CharacterCandidateScaleReview.tscn
          test -s character_candidate_scale_review.png
          file character_candidate_scale_review.png

      - name: Upload Character V6.6 candidate review
        uses: actions/upload-artifact@v4
        with:
          name: character-v66-candidate-review
          path: |
            character_v2_model_review.png
            character_v2_detail_review.png
            character_candidate_scale_review.png
            assets/review/player_character_candidate.glb
          if-no-files-found: error
          retention-days: 14
