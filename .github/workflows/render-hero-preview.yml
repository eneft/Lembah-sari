name: Render Hero Preview

on:
  push:
    branches:
      - visual/rebuild-vs01-v2
    paths-ignore:
      - 'assets/models/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y blender python3-numpy unzip xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxi6 libxcursor1 libxinerama1 libxkbcommon0 libasound2t64
          blender --version
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Build main house GLB in Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          LEMBAH_HOUSE_OUT="$PWD/assets/models/house_main_01.glb" \
            blender --background --python tools/blender/build_main_house.py
          test -s assets/models/house_main_01.glb
          file assets/models/house_main_01.glb
          ls -lh assets/models/house_main_01.glb

      - name: Persist generated hero asset on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/house_main_01.glb
          if ! git diff --cached --quiet; then
            git commit -m "build(art): generate Blender main house GLB"
            git push origin HEAD:visual/rebuild-vs01-v2
          fi

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit-after 45

      - name: Render Blender hero house in Godot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --resolution 1280x720 --rendering-method gl_compatibility res://scenes/HeroHouseShowcase.tscn
          test -s hero_house_preview.png
          file hero_house_preview.png

      - name: Upload hero house screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hero-house-preview
          path: hero_house_preview.png
          if-no-files-found: error

      - name: Upload generated GLB
        uses: actions/upload-artifact@v4
        with:
          name: main-house-glb
          path: assets/models/house_main_01.glb
          if-no-files-found: error
