name: Render Hero Preview

on:
  push:
    branches:
      - visual/rebuild-vs01-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y unzip xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxi6 libxcursor1 libxinerama1 libxkbcommon0 libasound2t64
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit-after 30

      - name: Render hero screenshot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --resolution 1280x720 --rendering-method gl_compatibility res://scenes/HeroPreview.tscn
          test -s hero_preview.png
          file hero_preview.png

      - name: Upload hero screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hero-preview
          path: hero_preview.png
          if-no-files-found: error
