name: Render Hero Preview

on:
  push:
    branches:
      - visual/rebuild-vs01-v2
    paths-ignore:
      - 'assets/models/**'
  workflow_dispatch:

concurrency:
  group: lembah-sari-hero-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Blender and render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y blender unzip xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxi6 libxcursor1 libxinerama1 libxkbcommon0 libasound2t64
          blender --version
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Build 2.5D main house GLB in Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          LEMBAH_HOUSE_OUT="$PWD/assets/models/house_main_01.glb" \
            blender --background --python tools/blender/build_main_house.py
          test -s assets/models/house_main_01.glb
          file assets/models/house_main_01.glb
          ls -lh assets/models/house_main_01.glb

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit-after 60

      - name: Render house-only concept review in Godot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --resolution 1280x720 --rendering-method gl_compatibility res://scenes/HeroHouseShowcaseV2.tscn
          test -s hero_house_focus_preview.png
          file hero_house_focus_preview.png

      - name: Upload house focus screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hero-house-focus-preview
          path: hero_house_focus_preview.png
          if-no-files-found: error

      - name: Upload generated house GLB
        uses: actions/upload-artifact@v4
        with:
          name: main-house-25d-glb
          path: assets/models/house_main_01.glb
          if-no-files-found: error
