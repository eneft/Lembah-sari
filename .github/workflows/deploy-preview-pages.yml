name: Deploy Visual Preview to Pages

on:
  workflow_dispatch:

concurrency:
  group: lembah-sari-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest V5 rebuild branch
        uses: actions/checkout@v4
        with:
          ref: visual/rebuild-vs01-v2

      - name: Restore latest successful V5 hero GLB artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          RUN_ID="$(curl -fsSL "${AUTH[@]}" \
            "${API}/actions/workflows/render-hero-environment-v5.yml/runs?branch=visual%2Frebuild-vs01-v2&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')"
          test -n "${RUN_ID}"

          ARTIFACT_ID="$(curl -fsSL "${AUTH[@]}" "${API}/actions/runs/${RUN_ID}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "hero-environment-v5-glb" and (.expired | not)) | .id' \
            | head -n 1)"
          test -n "${ARTIFACT_ID}"

          rm -rf /tmp/v5-glb /tmp/v5-glb.zip
          mkdir -p /tmp/v5-glb assets/models
          curl -fsSL -L "${AUTH[@]}" "${API}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/v5-glb.zip
          unzip -q -o /tmp/v5-glb.zip -d /tmp/v5-glb
          cp /tmp/v5-glb/hero_scene_v5.glb assets/models/hero_scene_v5.glb
          test -s assets/models/hero_scene_v5.glb
          echo "Restored V5 GLB from render run ${RUN_ID}, artifact ${ARTIFACT_ID}"
          ls -lh assets/models/hero_scene_v5.glb

      - name: Assemble new animated player GLB
        shell: bash
        run: |
          set -euo pipefail
          bash tools/assemble_player_character.sh
          test -s assets/models/player_character_lembah_sari.glb

      - name: Install Godot 4.7 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y unzip

          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/models/hero_scene_v5.glb
          test -s assets/models/player_character_lembah_sari.glb
          godot --headless --path . --editor --quit-after 90

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/models/hero_scene_v5.glb
          test -s assets/models/player_character_lembah_sari.glb
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
