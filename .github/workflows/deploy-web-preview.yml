name: Build Godot Web Preview

on:
  push:
    branches:
      - visual/2p5d-prototype
    paths-ignore:
      - 'assets/models/**'
      - 'assets/2p5d/house_main_render.png'
  workflow_dispatch:

concurrency:
  group: lembah-sari-web-preview-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Blender, Godot 4.7 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y blender unzip
          blender --version

          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

          curl -fL --retry 3 -o /tmp/godot-templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.7.stable/web_release.zip"

      - name: Render full-material 2.5D house sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/2p5d
          LEMBAH_HOUSE_SPRITE_OUT="$PWD/assets/2p5d/house_main_render.png" \
            blender --background --python tools/blender/render_main_house_sprite.py
          test -s assets/2p5d/house_main_render.png
          file assets/2p5d/house_main_render.png
          ls -lh assets/2p5d/house_main_render.png

      - name: Persist rendered house sprite
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/2p5d/house_main_render.png && git ls-files --error-unmatch assets/2p5d/house_main_render.png >/dev/null 2>&1; then
            echo "Rendered house sprite unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2p5d/house_main_render.png
          git commit -m "art(2.5d): bake full-material hero house sprite"
          git push origin HEAD:visual/2p5d-prototype

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit-after 90

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.wasm
          echo "Web build output:"
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload house material preview
        uses: actions/upload-artifact@v4
        with:
          name: house-material-2p5d-preview
          path: assets/2p5d/house_main_render.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable Web build
        uses: actions/upload-artifact@v4
        with:
          name: lembah-sari-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Trigger Pages deployment on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-preview-pages.yml/dispatches" \
            -d '{"ref":"main"}'
